# Development stack: nginx front on :80, Vite with HMR, uvicorn with --reload.
# Same topology as production, so path handling behaves identically.

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: sja-nginx-dev
    ports:
      - "8300:80"
    volumes:
      - ./deploy/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

  api:
    build:
      context: ./apps/api
      target: dev
    container_name: sja-api-dev
    env_file:
      - .env
    environment:
      APP_ENV: dev
      DATABASE_URL: sqlite:////app/data/sja.db
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/alembic:/app/alembic
      - sja-data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      target: dev
    container_name: sja-web-dev
    volumes:
      - ./apps/web/src:/repo/apps/web/src
      - ./apps/web/index.html:/repo/apps/web/index.html
      - ./apps/web/vite.config.ts:/repo/apps/web/vite.config.ts
      - ./packages/api-types/src:/repo/packages/api-types/src
    expose:
      - "5173"

volumes:
  sja-data:
