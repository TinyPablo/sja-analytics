[project]
name = "sja-api"
version = "0.1.0"
description = "Analytics API for Small Jump Adventures"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "sqlalchemy>=2.0.43",
    "alembic>=1.16",
    "pydantic-settings>=2.11",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sja_api"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# Depends(...) in argument defaults is the FastAPI idiom.
ignore = ["B008"]
